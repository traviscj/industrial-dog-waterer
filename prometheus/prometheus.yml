global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.rules.yml

alerting:
  alertmanagers:
    - static_configs: [{targets: ['alertmanager:9093']}]

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ['localhost:9090']}]

  - job_name: dogfountain
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets: ['dogfountain.home.arpa:80']
        labels: {location: kitchen, vlan: "iot"}
